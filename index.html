<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eneko</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #2563eb;
    --border: #e5e5e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #f0f0f0;
      --muted: #9a9a9a;
      --accent: #6ea8fe;
      --border: #2a2d33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 16px;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 4px;
  }
  p.tagline {
    color: var(--muted);
    margin-top: 0;
  }
  section {
    margin-top: 40px;
  }
  h2 {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 12px;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  li {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: none; }
  a {
    color: var(--accent);
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
  .desc {
    color: var(--muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<main>
  <h1>Eneko</h1>
  <p class="tagline">Página de apoyo para mis proyectos personales.</p>

  <section>
    <h2>Proyectos</h2>
    <ul>
      <li>
        <a href="https://github.com/enekovf/Domus">Domus</a>
        <div class="desc">Aplicación de gestión del hogar (Windows y Android).</div>
      </li>
      <li>
        <a href="mint/index.html">MINT</a>
        <div class="desc">Películas, series, juegos, música, podcasts y noticias (Windows y Android).</div>
      </li>
    </ul>
  </section>

  <section>
    <h2>Políticas de privacidad</h2>
    <ul>
      <li>
        <a href="privacidad.html">Domus</a>
      </li>
      <li>
        <a href="mint/privacidad.html">MINT</a>
      </li>
    </ul>
  </section>

</main>
</body>
</html>
